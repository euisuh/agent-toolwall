[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-toolwall"
version = "0.1.0"
description = "Policy enforcement between an LLM agent and its tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/euisuh/agent-toolwall"

[tool.hatch.build.targets.wheel]
packages = ["toolwall"]
